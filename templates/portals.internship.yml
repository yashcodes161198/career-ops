# Internship-focused discovery template for candidates in India.
# Personalize target disciplines, locations, and companies before the first scan.

scan_history:
  recheck_after_days: 14
  dedup_include_location: true

max_posting_age_days: 30

location_filter:
  always_allow:
    - "India"
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
    - "Pune"
    - "Gurugram"
    - "Gurgaon"
    - "Noida"
    - "Delhi"
    - "NCR"
    - "Chennai"
    - "Mumbai"
  allow:
    - "India"
    - "Remote"
    - "Worldwide"
    - "Anywhere"
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
    - "Pune"
    - "Gurugram"
    - "Gurgaon"
    - "Noida"
    - "Delhi"
    - "NCR"
    - "Chennai"
    - "Mumbai"

country_eligibility_filter:
  exclusionary:
    - "must be located in the united states"
    - "us-based candidates only"
    - "authorized to work in the us without sponsorship"
    - "must be authorized to work in the united states"
    - "remote within the united states"
    - "must reside in the us"
    - "uk-based candidates only"
    - "must reside in the uk"
    - "eu candidates only"
    - "must reside in the eu"
  inclusive:
    - "worldwide"
    - "work from anywhere"
    - "global remote"
    - "india"
    - "asia"
    - "apac"

title_filter:
  skip_tiers: []
  positive:
    - "Software Engineer Intern"
    - "Software Engineering Intern"
    - "SDE Intern"
    - "Backend Intern"
    - "Developer Intern"
    - "Platform Engineering Intern"
    - "Cloud Engineering Intern"
    - "DevOps Intern"
    - "Data Engineering Intern"
    - "Machine Learning Intern"
    - "Summer Intern"
    - "Winter Intern"
    - "Co-op"
    - "Apprentice"
    - "Graduate Engineer Trainee"
  negative:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead Engineer"
    - "Engineering Manager"
    - "Director"
  seniority_boost:
    - "Intern"
    - "Internship"
    - "Co-op"
    - "Graduate"
    - "Apprentice"

# These searches run through the agent-driven `/career-ops scan` workflow.
# The zero-token `npm run scan` command does not execute WebSearch queries.
search_queries:
  - name: LinkedIn India software internships
    query: 'site:linkedin.com/jobs/view ("Software Engineer Intern" OR "Software Engineering Intern" OR "SDE Intern" OR "Backend Intern") ("India" OR "Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote")'
    enabled: true

  - name: Naukri India software internships
    query: 'site:naukri.com ("Software Engineer Intern" OR "SDE Intern" OR "Backend Intern" OR "Graduate Engineer Trainee") ("Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote")'
    enabled: true

  - name: Wellfound India software internships
    query: 'site:wellfound.com/jobs ("Software Engineer Intern" OR "Backend Intern" OR "Developer Intern") ("India" OR "Remote")'
    enabled: true

  - name: Greenhouse India software internships
    query: 'site:job-boards.greenhouse.io ("Software Engineer Intern" OR "Software Engineering Intern" OR "SDE Intern" OR "Backend Intern") ("India" OR "Remote")'
    enabled: true

  - name: Ashby India software internships
    query: 'site:jobs.ashbyhq.com ("Software Engineer Intern" OR "SDE Intern" OR "Backend Intern" OR "Platform Intern") ("India" OR "Remote")'
    enabled: true

  - name: Lever India software internships
    query: 'site:jobs.lever.co ("Software Engineer Intern" OR "SDE Intern" OR "Backend Intern" OR "Developer Intern") ("India" OR "Remote")'
    enabled: true

  - name: General official internship postings
    query: '("Software Engineering Intern" OR "SDE Intern" OR "Backend Intern") ("India" OR "Bengaluru" OR "Hyderabad") -course -training'
    enabled: true

# Canonical company labels for dedup across ATS naming variants.
company_aliases:
  Salesforce: [Slack]
  Cisco: [AppDynamics]
  Cloud Software Group: [Citrix, TIBCO]
  Okta: [Auth0]
  Block: [Square]
  DoorDash: [Chowbotics]
  LG Ad Solutions: [Alphonso]
  Oracle: [Oracle OCI, OCI]

