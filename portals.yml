# Reject explicit 3+ year minimums in JD text. Missing descriptions still pass.
experience_filter:
  max_required_years: 2

# These searches run through the agent-driven `/career-ops scan` workflow.
# The zero-token `npm run scan` command does not execute WebSearch queries.
search_queries:
  - name: LinkedIn India fresher software roles
    query: 'site:linkedin.com/jobs/view ("Fresher" OR "Graduate Engineer Trainee" OR "Associate Software Engineer" OR "Junior Software Engineer" OR "SDE 1" OR "New Graduate" OR "Entry Level Software Engineer") ("India" OR "Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote") -intern -internship'
    enabled: true

  - name: Naukri India fresher software roles
    query: 'site:naukri.com ("Fresher" OR "Graduate Engineer Trainee" OR "GET" OR "Associate Software Engineer" OR "Junior Software Engineer" OR "SDE" OR "Software Engineer Fresher" OR "0-1 years") ("Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote") -intern -internship'
    enabled: true

  - name: Instahyre India fresher software roles
    query: 'site:instahyre.com ("Fresher" OR "Graduate" OR "Associate" OR "Junior" OR "Entry Level" OR "0-1") ("Software Engineer" OR "Developer" OR "SDE") India -intern'
    enabled: true

  - name: Wellfound India fresher software roles
    query: 'site:wellfound.com/jobs ("Fresher" OR "Junior" OR "Associate" OR "Graduate" OR "Entry Level") ("Software Engineer" OR "Developer" OR "SDE") ("India" OR "Remote") -intern'
    enabled: true

  - name: Greenhouse India fresher software roles
    query: 'site:job-boards.greenhouse.io ("Associate Software Engineer" OR "Software Engineer I" OR "Junior Software Engineer" OR "New Graduate" OR "University Graduate" OR "Graduate Engineer") ("India" OR "Remote") -intern'
    enabled: true

  - name: Ashby India fresher software roles
    query: 'site:jobs.ashbyhq.com ("Associate Software Engineer" OR "Software Engineer I" OR "Junior Software Engineer" OR "New Graduate" OR "Graduate Engineer") ("India" OR "Remote") -intern'
    enabled: true

  - name: Lever India fresher software roles
    query: 'site:jobs.lever.co ("Associate Software Engineer" OR "Software Engineer I" OR "Junior Software Engineer" OR "New Graduate" OR "Graduate Engineer") ("India" OR "Remote") -intern'
    enabled: true

  - name: General official fresher postings
    query: '("Software Engineer Fresher" OR "Graduate Engineer Trainee" OR "Associate Software Engineer" OR "Junior Software Engineer" OR "SDE 1" OR "Entry Level Software Engineer") ("India" OR "Bengaluru" OR "Hyderabad") -intern -internship -course -training -civil'
    enabled: true

  # Candidate-supplied company cohorts. These queries cover companies whose
  # official careers site is not exposed through a supported zero-token provider.
  # Scan mode must verify every result on the official employer site before
  # adding it to the pipeline.
  - name: Priority 1 companies — high pay, good WLB
    query: '("Adobe" OR "Apple" OR "Broadcom" OR "Citrix" OR "Expedia" OR "Google" OR "Indeed" OR "InMobi" OR "Intuit" OR "JPMorgan Chase" OR "LinkedIn" OR "MathWorks" OR "Microsoft" OR "Nutanix" OR "Nvidia" OR "PhonePe" OR "Salesforce" OR "ServiceNow") ("Associate Software Engineer" OR "Software Engineer I" OR "Junior Software Engineer" OR "Graduate Engineer" OR "New Graduate" OR "SDE 1" OR "Fresher") ("India" OR "Bengaluru" OR "Hyderabad" OR "Remote") jobs careers -intern -internship -civil'
    enabled: true

  - name: Priority 2 companies — high pay, unknown WLB
    query: '("Airbnb" OR "Alphonso" OR "AppDynamics" OR "Aviso" OR "Bloomreach" OR "Cohesity" OR "Compass" OR "Curefit" OR "Gojek" OR "Grab" OR "Hasura" OR "HealthifyMe" OR "Instabase" OR "MotorQ" OR "Oracle OCI" OR "Palo Alto Networks" OR "Postman" OR "Practo" OR "Quadeye" OR "Qubole" OR "Rubrik" OR "ShareChat" OR "Stripe" OR "Sumo Logic" OR "Swiggy" OR "Target" OR "Udaan" OR "Vizury" OR "Whatfix" OR "WorldQuant") ("Associate" OR "Junior" OR "Graduate" OR "Fresher" OR "SDE 1" OR "Entry Level") India jobs careers -intern -internship -civil'
    enabled: true

  - name: Priority 3 companies — high pay, bad WLB
    query: '("Amazon" OR "Arcesium" OR "Atlassian" OR "CodeNation" OR "Coinbase" OR "D. E. Shaw" OR "Flipkart" OR "Goldman Sachs" OR "Harness" OR "Morgan Stanley" OR "Rippling" OR "Sprinklr" OR "Tower Research" OR "Uber" OR "Zepto" OR "Zomato") ("Associate" OR "Junior" OR "Graduate" OR "Fresher" OR "SDE 1" OR "Entry Level") India jobs careers -intern -internship -civil'
    enabled: true

  - name: Priority 4 companies — mid pay, good WLB
    query: '("ARM" OR "Autodesk" OR "BlackBuck" OR "Cisco" OR "Datadog" OR "Directi" OR "Freshworks" OR "HashedIn" OR "Intel" OR "Mastercard" OR "Mentor Graphics" OR "Oracle" OR "Qualcomm" OR "Red Hat" OR "SAP Labs" OR "Samsung" OR "Slack" OR "Smallcase" OR "Texas Instruments" OR "Visa" OR "Zoho") ("Associate" OR "Junior" OR "Graduate" OR "Fresher" OR "SDE 1" OR "GET") India jobs careers -intern -internship -civil'
    enabled: true

  - name: Priority 5 companies — mid pay, unknown WLB
    query: '("Box8" OR "Chowbotics" OR "Cloudera" OR "Dunzo" OR "Jio" OR "Juniper Networks" OR "MakeMyTrip" OR "MyGate" OR "PayPal" OR "Razorpay" OR "SanDisk" OR "Twilio" OR "upGrad") ("Associate" OR "Junior" OR "Graduate" OR "Fresher" OR "SDE 1") India jobs careers -intern -internship -civil'
    enabled: true

  - name: Priority 6 companies — mid pay, bad WLB
    query: '("BigBasket" OR "CRED" OR "Dream11" OR "Disney Hotstar" OR "Ola" OR "OYO" OR "Paytm" OR "Unacademy" OR "Walmart" OR "Wissen" OR "Zeta") ("Associate" OR "Junior" OR "Graduate" OR "Fresher" OR "SDE 1") India jobs careers -intern -internship -civil'
    enabled: true

  - name: Unknown compensation companies
    query: '("Groupon" OR "Snowflake" OR "Truecaller" OR "Zoom") ("Associate" OR "Junior" OR "Graduate" OR "Fresher" OR "SDE 1") India jobs careers -intern -internship -civil'
    enabled: true

  - name: International sponsor and remote-first companies
    query: '("Agoda" OR "Booking.com" OR "ByteDance" OR "Databricks" OR "Meta" OR "Spotify" OR "Yelp" OR "Zalando" OR "Akamai" OR "Atlassian" OR "Auth0" OR "BrowserStack" OR "Coinbase" OR "Confluent" OR "GitHub" OR "GitLab" OR "Shopify" OR "Slack" OR "Square" OR "Stack Overflow") ("Associate" OR "Junior" OR "Graduate" OR "New Grad" OR "Entry Level") ("India" OR "remote India") jobs careers -intern -internship -civil'
    enabled: true

