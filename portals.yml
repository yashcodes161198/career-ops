# India-focused discovery for senior backend, platform, and full-stack roles.
# Personal company targets can be added under tracked_companies.

scan_history:
  recheck_after_days: 21
  dedup_include_location: true

max_posting_age_days: 21

location_filter:
  always_allow:
    - "India"
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
    - "Pune"
    - "Gurugram"
    - "Gurgaon"
    - "Noida"
    - "Delhi"
    - "NCR"
    - "Chennai"
    - "Mumbai"
  allow:
    - "India"
    - "Remote"
    - "Worldwide"
    - "Anywhere"
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
    - "Pune"
    - "Gurugram"
    - "Gurgaon"
    - "Noida"
    - "Delhi"
    - "NCR"
    - "Chennai"
    - "Mumbai"

country_eligibility_filter:
  exclusionary:
    - "must be located in the united states"
    - "us-based candidates only"
    - "authorized to work in the us without sponsorship"
    - "must be authorized to work in the united states"
    - "remote within the united states"
    - "must reside in the us"
    - "uk-based candidates only"
    - "must reside in the uk"
    - "eu candidates only"
    - "must reside in the eu"
  inclusive:
    - "worldwide"
    - "work from anywhere"
    - "global remote"
    - "india"
    - "asia"
    - "apac"

title_filter:
  skip_tiers: [intern, entry]
  positive:
    - "Senior Software Engineer"
    - "Staff Software Engineer"
    - "Lead Software Engineer"
    - "Principal Software Engineer"
    - "Backend Engineer"
    - "Back End Engineer"
    - "Backend Developer"
    - "Java Developer"
    - "Java Backend Developer"
    - "Java Full Stack Developer"
    - "Java Full-Stack Developer"
    - "Spring Boot Developer"
    - "Platform Engineer"
    - "Distributed Systems Engineer"
    - "API Engineer"
    - "Full Stack Engineer"
    - "Full-Stack Engineer"
    - "Fullstack Engineer"
    - "Full Stack Developer"
    - "Full-Stack Developer"
    - "Fullstack Developer"
    - "Web Engineer"
  negative:
    - "word:Intern"
    - "word:Interns"
    - "Internship"
    - "Junior"
    - "Graduate"
    - "Frontend"
    - "Front End"
    - "Mobile"
    - "Android"
    - "iOS"
    - "QA"
    - "Quality Assurance"
    - "Support Engineer"
    - "Salesforce"
    - "SAP "
    - "WordPress"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"

# These searches run through the agent-driven `/career-ops scan` workflow.
# The zero-token `npm run scan` command does not execute WebSearch queries.
search_queries:
  - name: LinkedIn India backend and full-stack
    query: 'site:linkedin.com/jobs/view ("Senior Software Engineer" OR "Staff Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer") ("India" OR "Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote")'
    enabled: true

  - name: Naukri backend and full-stack
    query: 'site:naukri.com ("Senior Software Engineer" OR "Backend Engineer" OR "Java Developer" OR "Java Backend Developer" OR "Java Full Stack Developer" OR "Spring Boot Developer") ("Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote")'
    enabled: true

  - name: Instahyre backend and full-stack
    query: 'site:instahyre.com ("Senior Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer") ("India" OR "Bengaluru" OR "Remote")'
    enabled: true

  - name: Wellfound India backend and full-stack
    query: 'site:wellfound.com/jobs ("Senior Software Engineer" OR "Backend Engineer" OR "Platform Engineer" OR "Java Developer" OR "Full Stack Engineer") ("India" OR "Remote")'
    enabled: true

  - name: Hirist senior engineering
    query: 'site:hirist.tech ("Senior Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer")'
    enabled: true

  - name: Cutshort senior engineering
    query: 'site:cutshort.io/job ("Senior Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer")'
    enabled: true

  - name: Foundit India senior engineering
    query: 'site:foundit.in ("Senior Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer")'
    enabled: true

  # Fishbowl is primarily a professional community, so this query discovers
  # public hiring and referral posts rather than conventional job-board pages.
  - name: Fishbowl India engineering hiring and referrals
    query: 'site:fishbowlapp.com/post ("hiring" OR "referral" OR "refer") ("Senior Software Engineer" OR "Backend Engineer" OR "Java Developer" OR "Platform Engineer" OR "Full Stack Engineer") ("India" OR "Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote")'
    enabled: true

  - name: Greenhouse India
    query: 'site:job-boards.greenhouse.io ("Senior Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer") ("India" OR "Remote")'
    enabled: true

  - name: Ashby India
    query: 'site:jobs.ashbyhq.com ("Senior Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer") ("India" OR "Remote")'
    enabled: true

  - name: Lever India
    query: 'site:jobs.lever.co ("Senior Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer") ("India" OR "Remote")'
    enabled: true

  - name: Requested senior employers group 1
    query: '("Amazon" OR "Arcesium" OR "Atlassian" OR "CodeNation" OR "Coinbase" OR "D. E. Shaw" OR "Flipkart" OR "Goldman Sachs" OR "Harness" OR "Morgan Stanley" OR "Rippling" OR "Sprinklr" OR "Tower Research" OR "Uber" OR "Zepto" OR "Zomato") ("Senior Software Engineer" OR "Backend Engineer" OR "Platform Engineer" OR "Full Stack Engineer") ("India" OR "Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote India")'
    enabled: true

  - name: Requested senior employers group 2
    query: '("Airbnb" OR "LG Ad Solutions" OR "AppDynamics" OR "Aviso" OR "Bloomreach" OR "Cohesity" OR "Compass" OR "Curefit" OR "Gojek" OR "Grab" OR "Hasura" OR "HealthifyMe" OR "Instabase" OR "MotorQ" OR "Oracle OCI" OR "Palo Alto Networks") ("Senior Software Engineer" OR "Backend Engineer" OR "Platform Engineer" OR "Full Stack Engineer") ("India" OR "Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote India")'
    enabled: true

  - name: Requested senior employers group 3
    query: '("Postman" OR "Practo" OR "Quadeye" OR "Qubole" OR "Rubrik" OR "ShareChat" OR "Stripe" OR "Sumo Logic" OR "Swiggy" OR "Target" OR "Udaan" OR "Vizury" OR "Whatfix" OR "WorldQuant") ("Senior Software Engineer" OR "Backend Engineer" OR "Platform Engineer" OR "Full Stack Engineer") ("India" OR "Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote India")'
    enabled: true

  - name: Requested senior employers group 4
    query: '("Box8" OR "DoorDash" OR "Cloudera" OR "Dunzo" OR "Jio" OR "Juniper Networks" OR "MakeMyTrip" OR "MyGate" OR "PayPal" OR "Razorpay" OR "SanDisk" OR "Twilio" OR "upGrad") ("Senior Software Engineer" OR "Backend Engineer" OR "Platform Engineer" OR "Full Stack Engineer") ("India" OR "Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote India")'
    enabled: true

  - name: Requested senior employers group 5
    query: '("Akamai" OR "Atlassian" OR "Okta" OR "BrowserStack" OR "Coinbase" OR "Confluent" OR "GitHub" OR "GitLab" OR "Meta" OR "Shopify" OR "Salesforce Slack" OR "Block Square" OR "Stack Overflow") ("Senior Software Engineer" OR "Backend Engineer" OR "Platform Engineer" OR "Full Stack Engineer") ("India" OR "Bengaluru" OR "Hyderabad" OR "Pune" OR "Gurugram" OR "Remote India")'
    enabled: true

# Canonical company labels for dedup across ATS naming variants.
company_aliases:
  Salesforce: [Slack]
  Cisco: [AppDynamics]
  Cloud Software Group: [Citrix, TIBCO]
  Okta: [Auth0]
  Block: [Square]
  DoorDash: [Chowbotics]
  LG Ad Solutions: [Alphonso]
  Oracle: [Oracle OCI, OCI]

