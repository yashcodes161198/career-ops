# Fresher-focused discovery template for candidates in India.
# Personalize target disciplines, locations, and companies before the first scan.

# Skip senior-tier titles only. Internships are rejected via title_filter negatives
# because valid GET/trainee titles classify as intern in classify-tier.mjs.
skip_tiers: [senior]

scan_history:
  recheck_after_days: 14
  dedup_include_location: true

max_posting_age_days: 30

location_filter:
  block_hard:
    - "Remote - USA"
    - "Remote - US"
    - "US, Remote"
    - "United States, Remote"
    - "Remote, United States"
    - "Remote - Ireland"
    - "Remote, Ireland"
    - "Remote - United Kingdom"
    - "Remote, United Kingdom"
    - "Remote - Canada"
    - "Remote, Canada"
    - "Remote - Poland"
    - "Remote, Poland"
    - "Remote - Slovenia"
    - "Remote, Slovenia"
  always_allow:
    - "India"
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
    - "Pune"
    - "Gurugram"
    - "Gurgaon"
    - "Noida"
    - "Delhi"
    - "NCR"
    - "Chennai"
    - "Mumbai"
  allow:
    - "India"
    - "Remote India"
    - "India Remote"
    - "APAC"
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
    - "Pune"
    - "Gurugram"
    - "Gurgaon"
    - "Noida"
    - "Delhi"
    - "NCR"
    - "Chennai"
    - "Mumbai"
    - "Remote"
    - "Worldwide"
    - "Anywhere"

country_eligibility_filter:
  exclusionary:
    - "must be located in the united states"
    - "us-based candidates only"
    - "authorized to work in the us without sponsorship"
    - "must be authorized to work in the united states"
    - "remote within the united states"
    - "must reside in the us"
    - "uk-based candidates only"
    - "must reside in the uk"
    - "eu candidates only"
    - "must reside in the eu"
  inclusive:
    - "worldwide"
    - "work from anywhere"
    - "global remote"
    - "india"
    - "asia"
    - "apac"

